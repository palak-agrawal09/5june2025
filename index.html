<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <div class="row mt-5">
                <div class="col-8 offset-2">
                    <form method="POST" action="http://localhost:1337/api/cars">
                       <input type="text" name="name" class="form-control form-control-sm mb-4 " placeholder="enter your car name"/>
                       <div class= "btn-lg d-grid gap-2">
                         <input type="submit" value="regiester" class="btn btn-primary " onclick="sendData(event)"/>
                       </div>
                       
                    </form>

                </div>

            </div>

        </div>
        <div class="row mt-5">
            <div class="col-8 offset-2">
            <table class=" table table-success">
                <thead>
                    <tr>
                        <th>CarName</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="table-priamary">
                        <td>BMW</td>
                        <td>
                        <button class="btn btn-success btn-sm">View</button>
                        <button class="btn btn-warning btn-sm">Edit</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                        </td>
                       
                    </tr>
                    <tr class="table-priamary">
                        <td>Auddi</td>
                        <td>
                        <button class="btn btn-success btn-sm">View</button>
                        <button class="btn btn-warning btn-sm">Edit</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                        </td>
                        
                    </tr>
                </tbody>
                <tfoot></tfoot>
            </table>

        </div>
    </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script>
        function sendData(e){ // formal argument;
            //object.method();
            //to stop the reloading
            e.preventDefault(); //camelCase
            console.log('i am inside sendData function');
            // i want to access form data here.....
            //traversing up
            console.log(e.target.closest('form'));
            //traversing down
            console.log(e.target.closest('form').querySelector('input:first-child').value);
            
            //let prepare our payload
            /*
            {
                "data": {
                "name": "BMW"
                }
            }
            */
           
                let jspayload ={
                    "data": {
                     "name": "BMW"
                }
            };
            console.log(jspayload);
            //let ceo1 = new className();
            var xhr = new XMLHttpRequest();
            //how to access class method
            //object.method();
            xhr.open("POST","http://localhost:1337/api/cars") ;
            //call the api
            let json= JSON.stringify(jspayload);
            xhr.send(json);
        }
        
    </script>
</body>
</html>
